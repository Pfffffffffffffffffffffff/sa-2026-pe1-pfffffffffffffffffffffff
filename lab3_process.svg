<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="870" viewBox="0 0 1780 870" role="img" aria-labelledby="title desc">
  <title id="title">Заявка жильца в УК: проект инструкции v1.0</title>
  <desc id="desc">Проектная модель процесса: житель сообщает о проблеме, диспетчер проверяет сведения и регистрирует заявку, УК назначает исполнителя, результат возвращается жильцу. Фактических наблюдений нет.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172554; }
      .lane { stroke-width: 1.5; }
      .lane-label { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .task { stroke-width: 1.6; rx: 8; }
      .task-text { font-size: 14px; text-anchor: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .edge-label { font-size: 11px; text-anchor: middle; fill: #334155; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
      .branch { font-size: 12px; font-weight: 700; fill: #475569; }
    </style>
  </defs>
  <rect width="1780" height="870" fill="#ffffff"/>
  <text x="42" y="42" font-size="24" font-weight="700">Заявка жильца в УК: проект инструкции v1.0</text>
  <text x="42" y="69" font-size="14" fill="#b45309">Учебная модель, не утверждённая УК; наблюдений — 0.</text>

  <rect class="lane" x="40" y="95" width="1700" height="165" fill="#ecfdf5" stroke="#86efac"/>
  <rect class="lane" x="40" y="270" width="1700" height="180" fill="#eff6ff" stroke="#93c5fd"/>
  <rect class="lane" x="40" y="460" width="1700" height="140" fill="#fff7ed" stroke="#fdba74"/>
  <rect class="lane" x="40" y="610" width="1700" height="190" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="lane-label" x="56" y="122" fill="#166534">ЖИТЕЛЬ</text>
  <text class="lane-label" x="56" y="297" fill="#1d4ed8">ДИСПЕТЧЕР</text>
  <text class="lane-label" x="56" y="487" fill="#9a3412">РЕЕСТР ЗАЯВОК</text>
  <text class="lane-label" x="56" y="637" fill="#475569">УК / ИСПОЛНИТЕЛЬ</text>

  <path class="edge" d="M233 180 H260"/>
  <path class="edge" d="M410 180 C435 180 435 350 465 350"/>
  <path class="edge" d="M610 350 H665"/>
  <path class="edge" d="M710 403 V420 H635"/>
  <path class="edge" d="M635 420 C600 245 555 230 537 215"/>
  <path class="edge" d="M537 215 C470 270 465 300 500 325"/>
  <path class="edge" d="M 1255 700 H 1280"/>
  <path class="edge" d="M755 350 C790 350 790 510 835 530"/>
  <path class="edge" d="M1025 530 C1080 530 1080 700 1080 700"/>
  <path class="edge" d="M1455 700 H1480"/>
  <path class="edge" d="M1525 655 C1540 550 1430 420 1390 393"/>
  <path class="edge" d="M1480 700 C1425 785 1210 785 1210 735"/>
  <path class="edge" d="M1390 325 C1440 275 1490 230 1510 180"/>
  <path class="edge" d="M1675 180 H1690"/>

  <text class="edge-label" x="420" y="270">Адрес, контакт, время, описание</text>
  <text class="branch" x="770" y="337">Да</text>
  <text class="branch" x="720" y="420">Нет</text>
  <text class="edge-label" x="910" y="475">Номер и карточка заявки</text>
  <text class="edge-label" x="1145" y="650">Назначение и описание работ</text>
  <text class="branch" x="1555" y="635">Да</text>
  <text class="branch" x="1375" y="780">Нет: причина и новый срок</text>
  <text class="edge-label" x="1450" y="270">Статус и результат</text>

  <circle cx="214" cy="180" r="19" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <circle cx="214" cy="180" r="15" fill="none" stroke="#15803d"/>
  <rect class="task" x="260" y="145" width="150" height="70" fill="#dcfce7" stroke="#22c55e"/>
  <text class="task-text" x="335" y="174"><tspan x="335">Сообщает адрес</tspan><tspan x="335" dy="19">и проблему</tspan></text>
  <rect class="task" x="465" y="325" width="145" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="task-text" x="537" y="353"><tspan x="537">Принимает</tspan><tspan x="537" dy="19">обращение</tspan></text>
  <polygon points="710,305 755,350 710,395 665,350" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text class="task-text" x="710" y="346"><tspan x="710">Данных</tspan><tspan x="710" dy="17">достаточно?</tspan></text>
  <rect class="task" x="560" y="420" width="150" height="48" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="task-text" x="635" y="449">Запрашивает уточнение</text>
  <rect class="task" x="465" y="145" width="145" height="70" fill="#dcfce7" stroke="#22c55e"/>
  <text class="task-text" x="537" y="174"><tspan x="537">Уточняет</tspan><tspan x="537" dy="19">сведения</tspan></text>
  <rect class="task" x="835" y="495" width="190" height="70" fill="#ffedd5" stroke="#fb923c"/>
  <text class="task-text" x="930" y="523"><tspan x="930">Регистрирует заявку,</tspan><tspan x="930" dy="19">присваивает номер</tspan></text>
  <rect class="task" x="1080" y="665" width="175" height="70" fill="#f1f5f9" stroke="#64748b"/>
  <text class="task-text" x="1167" y="693"><tspan x="1167">Назначает исполнителя</tspan><tspan x="1167" dy="19">и плановый срок</tspan></text>
  <rect class="task" x="1280" y="665" width="175" height="70" fill="#f1f5f9" stroke="#64748b"/>
  <text class="task-text" x="1367" y="693"><tspan x="1367">Выполняет работу</tspan><tspan x="1367" dy="19">или сообщает причину</tspan></text>
  <polygon points="1525,655 1570,700 1525,745 1480,700" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text class="task-text" x="1525" y="696"><tspan x="1525">Работа</tspan><tspan x="1525" dy="17">выполнена?</tspan></text>
  <rect class="task" x="1300" y="325" width="185" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="task-text" x="1392" y="353"><tspan x="1392">Обновляет реестр,</tspan><tspan x="1392" dy="19">уведомляет жильца</tspan></text>
  <rect class="task" x="1510" y="145" width="165" height="70" fill="#dcfce7" stroke="#22c55e"/>
  <text class="task-text" x="1592" y="174"><tspan x="1592">Получает номер</tspan><tspan x="1592" dy="19">и результат</tspan></text>
  <circle cx="1709" cy="180" r="19" fill="#fff" stroke="#15803d" stroke-width="3"/>
  <circle cx="1709" cy="180" r="14" fill="none" stroke="#15803d"/>
  <text x="42" y="840" font-size="12" fill="#64748b">Сплошные стрелки — ход процесса и передаваемые данные. Развилки и петли показаны как требования модели и нуждаются в проверке наблюдением.</text>
</svg>
