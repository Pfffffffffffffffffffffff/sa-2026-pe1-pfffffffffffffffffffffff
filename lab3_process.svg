<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="820" viewBox="0 0 1660 820" role="img" aria-labelledby="title desc">
  <title id="title">Наблюдение в чате жильцов: отсутствие горячей воды, август 2026</title>
  <desc id="desc">Реконструкция по сообщениям жильцов и памяти наблюдателя. Точные даты и количество эпизодов неизвестны; жалоба на бездействие и связь с приездом рабочих не подтверждены.</desc>
  <defs>
    <marker id="arrow-solid" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c2410c"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172554; }
      .lane { stroke-width: 1.5; }
      .lane-label { font-size: 13px; font-weight: 700; }
      .task { stroke-width: 1.6; rx: 8; }
      .task-text { font-size: 14px; text-anchor: middle; }
      .solid { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow-solid); }
      .dashed { fill: none; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow-dashed); }
      .label { font-size: 12px; text-anchor: middle; fill: #475569; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="1660" height="820" fill="#fff"/>
  <text x="36" y="39" font-size="23" font-weight="700">Жалобы на отсутствие горячей воды</text>
  <text x="36" y="66" font-size="14" fill="#92400e">Чат жильцов, август 2026; эпизодов больше одного, точный счёт не сохранён.</text>
  <text x="36" y="88" font-size="13" fill="#92400e">Пунктиром отмечены сведения и причинные связи, которые не удалось подтвердить.</text>

  <rect class="lane" x="30" y="105" width="1580" height="140" fill="#ecfdf5" stroke="#86efac"/>
  <rect class="lane" x="30" y="255" width="1580" height="145" fill="#eff6ff" stroke="#93c5fd"/>
  <rect class="lane" x="30" y="410" width="1580" height="150" fill="#fff7ed" stroke="#fdba74"/>
  <rect class="lane" x="30" y="570" width="1580" height="170" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="lane-label" x="45" y="128" fill="#166534">ЖИЛЬЦЫ</text>
  <text class="lane-label" x="45" y="278" fill="#1d4ed8">ЧАТ ЖИЛЬЦОВ / ИСТОЧНИК НАБЛЮДЕНИЯ</text>
  <text class="lane-label" x="45" y="433" fill="#9a3412">УК / ДИСПЕТЧЕР</text>
  <text class="lane-label" x="45" y="593" fill="#475569">РАБОЧИЕ</text>

  <path class="solid" d="M241 180 H270"/>
  <path class="solid" d="M455 180 H505"/>
  <path class="solid" d="M555 230 C555 265 620 270 620 297"/>
  <path class="dashed" d="M605 180 H700"/>
  <path class="dashed" d="M765 333 C810 333 820 488 870 488"/>
  <path class="dashed" d="M1065 488 C1110 488 1140 650 1190 650"/>
  <path class="solid" d="M1420 659 H1450"/>
  <path class="dashed" d="M1600 659 H1620"/>

  <circle cx="223" cy="180" r="18" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <circle cx="223" cy="180" r="14" fill="none" stroke="#15803d"/>
  <rect class="task" x="270" y="147" width="185" height="66" fill="#dcfce7" stroke="#22c55e"/>
  <text class="task-text" x="362" y="174"><tspan x="362">Обнаруживают</tspan><tspan x="362" dy="19">отсутствие горячей воды</tspan></text>
  <polygon points="555,130 605,180 555,230 505,180" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text class="task-text" x="555" y="176"><tspan x="555">Считают</tspan><tspan x="555" dy="17">срочной?</tspan></text>
  <text class="label" x="620" y="254">Да: требуют срочного решения</text>
  <text class="label" x="650" y="168">Нет</text>
  <rect class="task" x="700" y="147" width="190" height="66" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text class="task-text" x="795" y="174"><tspan x="795">Ветка «не срочно»</tspan><tspan x="795" dy="19">не наблюдалась</tspan></text>
  <rect class="task" x="520" y="297" width="245" height="70" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="task-text" x="642" y="324"><tspan x="642">Повторные сообщения:</tspan><tspan x="642" dy="19">нет горячей воды</tspan></text>
  <rect x="810" y="290" width="255" height="82" rx="7" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="825" y="314" font-size="12"><tspan x="825">Август 2026</tspan><tspan x="825" dy="18">Больше одного эпизода;</tspan><tspan x="825" dy="18">точное число неизвестно</tspan></text>
  <rect class="task" x="870" y="455" width="195" height="66" fill="#ffedd5" stroke="#fb923c" stroke-dasharray="7 5"/>
  <text class="task-text" x="967" y="482"><tspan x="967">Возможная жалоба</tspan><tspan x="967" dy="19">на бездействие</tspan></text>
  <rect x="1110" y="445" width="300" height="84" rx="7" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="1125" y="469" font-size="12"><tspan x="1125">По памяти: «вроде»</tspan><tspan x="1125" dy="18">Адресат и официальная регистрация</tspan><tspan x="1125" dy="18">неизвестны</tspan></text>
  <rect class="task" x="1190" y="617" width="230" height="68" fill="#f1f5f9" stroke="#64748b"/>
  <text class="task-text" x="1305" y="644"><tspan x="1305">Приезжают осмотреть</tspan><tspan x="1305" dy="19">через пару дней</tspan></text>
  <rect class="task" x="1450" y="617" width="150" height="68" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="7 5"/>
  <text class="task-text" x="1525" y="644"><tspan x="1525">Результат</tspan><tspan x="1525" dy="19">неизвестен</tspan></text>
  <circle cx="1638" cy="650" r="18" fill="#fff" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="1638" cy="650" r="13" fill="none" stroke="#64748b" stroke-dasharray="5 4"/>

  <text class="label" x="480" y="164">Сообщение: горячей воды нет</text>
  <text class="label" x="585" y="385">Сообщения и требование решить срочно</text>
  <text class="label" x="815" y="420">Предполагаемая жалоба на бездействие</text>
  <text class="label" x="1110" y="570">Связь жалобы с выездом не подтверждена</text>
  <text class="label" x="1435" y="605">Факт осмотра; результат не сообщён</text>
  <text x="36" y="785" font-size="12" fill="#475569">Сплошная линия — событие из сообщения наблюдателя; пунктир — непроверенная связь или неизвестный этап.</text>
</svg>
