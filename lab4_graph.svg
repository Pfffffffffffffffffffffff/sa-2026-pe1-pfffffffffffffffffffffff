<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Граф обработки заявок жильцов в управляющей компании</title>
<desc id="desc">Направленные связи между жильцом, диспетчером, реестром заявок и управляющей компанией.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="context-stroke"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#172554}.edge{fill:none;stroke-width:2.4;marker-end:url(#arrow)}.node{stroke-width:2;rx:10}.label{font-size:14px;text-anchor:middle}.flow{font-size:12px;text-anchor:middle;fill:#334155}.legend{font-size:13px}</style>
</defs>
<rect width="1200" height="650" fill="#ffffff"/>
<text x="40" y="42" font-size="24" font-weight="700">Граф обработки заявок жильцов в УК</text>
<text x="40" y="68" font-size="14" fill="#475569">Рёбра и подписи построены из lab4_adjacency.csv и lab4_edges.csv</text>
<path class="edge" d="M 270 338 C 330 255 420 255 478 338" stroke="#2563eb" marker-end="url(#arrow)"/>
<text class="flow" x="374" y="273" paint-order="stroke" stroke="white" stroke-width="5">Адрес и описание проблемы</text>
<path class="edge" d="M 478 362 C 420 445 330 445 270 362" stroke="#c2410c" marker-end="url(#arrow)"/>
<text class="flow" x="374" y="435" paint-order="stroke" stroke="white" stroke-width="5">Номер и статус заявки</text>
<path class="edge" d="M 575 338 C 635 255 725 255 783 338" stroke="#2563eb" marker-end="url(#arrow)"/>
<text class="flow" x="679" y="273" paint-order="stroke" stroke="white" stroke-width="5">Карточка заявки и приоритет</text>
<path class="edge" d="M 783 362 C 725 445 635 445 575 362" stroke="#16803c" marker-end="url(#arrow)"/>
<text class="flow" x="679" y="435" paint-order="stroke" stroke="white" stroke-width="5">Очередь и статус заявки</text>
<path class="edge" d="M 880 338 C 940 255 1030 255 1088 338" stroke="#2563eb" marker-end="url(#arrow)"/>
<text class="flow" x="984" y="273" paint-order="stroke" stroke="white" stroke-width="5">Заявка в работу</text>
<path class="edge" d="M 1088 362 C 1030 445 940 445 880 362" stroke="#16803c" marker-end="url(#arrow)"/>
<text class="flow" x="984" y="435" paint-order="stroke" stroke="white" stroke-width="5">Назначение и результат</text>
<rect class="node" x="95" y="320" width="180" height="60" fill="#ecfdf5" stroke="#16a34a"/>
<text class="label" x="185" y="355" font-weight="700">Житель</text>
<rect class="node" x="400" y="320" width="180" height="60" fill="#eff6ff" stroke="#2563eb"/>
<text class="label" x="490" y="355" font-weight="700">Диспетчер</text>
<rect class="node" x="705" y="320" width="180" height="60" fill="#fff7ed" stroke="#ea580c"/>
<text class="label" x="795" y="355" font-weight="700">Реестр заявок</text>
<rect class="node" x="1010" y="320" width="180" height="60" fill="#f8fafc" stroke="#64748b"/>
<text class="label" x="1100" y="355" font-weight="700">Управляющая компания</text>
<line x1="55" y1="600" x2="95" y2="600" stroke="#2563eb" stroke-width="3"/>
<text class="legend" x="105" y="605">приём и регистрация</text>
<line x1="300" y1="600" x2="340" y2="600" stroke="#16803c" stroke-width="3"/>
<text class="legend" x="350" y="605">передача в работу и статус</text>
<line x1="630" y1="600" x2="670" y2="600" stroke="#c2410c" stroke-width="3"/>
<text class="legend" x="680" y="605">ответ жильцу</text>
</svg>
